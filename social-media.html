<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Overlay</title>
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div class="overlay-wrapper" id="social-wrapper">
    <!-- Items injected dynamically -->
  </div>

  <script src="config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let activeConfig = (typeof config !== 'undefined') ? config : null;

      const urlParams = new URLSearchParams(window.location.search);
      const dataParam = urlParams.get('data');
      
      if (dataParam) {
          try {
              activeConfig = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
          } catch (e) {
              console.error("Failed to parse config from URL", e);
          }
      }

      if (activeConfig) {
        // Apply Styles dynamically
        const root = document.documentElement;
        if (activeConfig.variation) {
            document.body.classList.add("theme-" + activeConfig.variation);
        }

        if (activeConfig.primaryColor) {
            root.style.setProperty('--primary-color', activeConfig.primaryColor);
        }

        // Apply HTML
        if (activeConfig.socialMedia) {
          const wrapper = document.getElementById('social-wrapper');
          wrapper.innerHTML = ''; 
          
          activeConfig.socialMedia.forEach(social => {
            const container = document.createElement('div');
            container.className = 'container';
            // Use custom duration if specified
            const durationStyle = activeConfig.animDuration ? `style="animation-duration: ${activeConfig.animDuration}s;"` : '';
            
            container.innerHTML = `
              <div class="box bg-blue roll-in-blurred-bottom" ${durationStyle}>
                <i class="${social.iconClass || social.icon} icon"></i>
              </div>
              <div class="box-white scale-up-tl" ${durationStyle}>
                <div class="text">${social.handle}</div>
              </div>
            `;
            wrapper.appendChild(container);
          });
        }
      }
    });
  </script>
</body>
</html>
