<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lower Third Overlay</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="overlay-wrapper lower-third-wrapper">
        <div class="container lower-third-container">
            <div class="rect bg-blue roll-in-blurred-bottom"></div>
            <div class="lower-third-content">
                <div class="box-upper scale-up-tl">
                    <div class="text co-white" id="lt-name">Loading...</div>
                </div>
                <div class="box-lower scale-up-tl">
                    <div class="text-lower co-black" id="lt-role">Loading...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let activeConfig = (typeof config !== 'undefined') ? config : null;

            // Check for URL parameters overriding config
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');
            
            if (dataParam) {
                try {
                    activeConfig = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
                } catch (e) {
                    console.error("Failed to parse config from URL", e);
                }
            }

            if (activeConfig) {
                // Apply Text
                if (activeConfig.lowerThird) {
                    document.getElementById('lt-name').innerText = activeConfig.lowerThird.name;
                    document.getElementById('lt-role').innerText = activeConfig.lowerThird.role;
                }
                
                // Apply Styles dynamically
                const root = document.documentElement;
                if (activeConfig.primaryColor) {
                    root.style.setProperty('--primary-color', activeConfig.primaryColor);
                    // Generate a transparent version for the upper box
                    root.style.setProperty('--bg-primary-transparent', activeConfig.primaryColor + 'd9'); 
                }
                if (activeConfig.animDuration) {
                    const duration = activeConfig.animDuration + 's';
                    // We can override the animation duration on the specific elements
                    const animatedEls = document.querySelectorAll('.roll-in-blurred-bottom, .scale-up-tl');
                    animatedEls.forEach(el => {
                        el.style.animationDuration = duration;
                    });
                }
            }
        });
    </script>
</body>
</html>
