<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lower Third Overlay</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="overlay-wrapper lower-third-wrapper">
        <div class="container lower-third-container">
            <div class="rect bg-blue anim-primary"></div>
            <div class="lower-third-content">
                <div class="box-upper anim-secondary">
                    <div class="text co-white" id="lt-name">Loading...</div>
                </div>
                <div class="box-lower anim-secondary">
                    <div class="text-lower co-black" id="lt-role">Loading...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let activeConfig = (typeof config !== 'undefined') ? config : null;

            // Check for URL parameters overriding config
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');
            
            if (dataParam) {
                try {
                    activeConfig = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
                } catch (e) {
                    console.error("Failed to parse config from URL", e);
                }
            }

            if (activeConfig) {
                // Apply Text
                if (activeConfig.lowerThird) {
                    document.getElementById('lt-name').innerText = activeConfig.lowerThird.name;
                    document.getElementById('lt-role').innerText = activeConfig.lowerThird.role;
                }
                
                // Apply Styles dynamically
                const root = document.documentElement;
                if (activeConfig.animStyle) {
                    document.body.classList.add("anim-style-" + activeConfig.animStyle);
                } else {
                    document.body.classList.add("anim-style-1");
                }

                if (activeConfig.variation) {
                    document.body.classList.add("theme-" + activeConfig.variation);
                }

                if (activeConfig.secondaryColor) {
                    root.style.setProperty("--secondary-color", activeConfig.secondaryColor);
                }
                if (activeConfig.textLight) {
                    root.style.setProperty("--text-light", activeConfig.textLight);
                }
                if (activeConfig.textDark) {
                    root.style.setProperty("--text-dark", activeConfig.textDark);
                }

                if (activeConfig.primaryColor) {
                    root.style.setProperty('--primary-color', activeConfig.primaryColor);
                    // Generate a transparent version for the upper box
                    root.style.setProperty('--bg-primary-transparent', activeConfig.primaryColor + 'd9'); 
                }
                if (activeConfig.animDuration) {
                    const duration = activeConfig.animDuration + 's';
                    // We can override the animation duration on the specific elements
                    const animatedEls = document.querySelectorAll('.anim-primary, .anim-secondary');
                    animatedEls.forEach(el => {
                        el.style.animationDuration = duration;
                    });
                }
            }
        });
    </script>
</body>
</html>
